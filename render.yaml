# Render Blueprint: single free web service running the Express API and, via
# RUN_WORKER=1, the job worker in the same process. Frontend is hosted on
# Vercel; the database is a MongoDB Atlas M0 cluster. See deployment/README.md.
services:
  - type: web
    name: ahead-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_WORKER
        value: "1"
      - key: PORT
        value: "8000"
      - key: MONGODB_DATABASE
        value: ahead
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_RPM
        value: "15"
      - key: GEMINI_TPM
        value: "250000"
      # Set these in the Render dashboard (Environment tab) — never commit them:
      #   MONGODB_URI      authenticated Atlas SRV connection string
      #   ALLOWED_ORIGINS  https://<your-vercel-domain>  (comma-separated if several)
      #   GEMINI_API_KEY   free key from https://aistudio.google.com/apikey
      #   TAVILY_API_KEY   optional, enables public interview search
      #   YOUTUBE_API_KEY  optional, enables verified video resources
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
