services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [smoke_database:/data/db]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate().ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  proxy:
    ports: !override ['127.0.0.1:3443:443']
    volumes:
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
  api:
    environment:
      ALLOWED_ORIGINS: https://localhost:3443
    depends_on:
      mongo: {condition: service_healthy}
  worker:
    environment:
      ALLOWED_ORIGINS: https://localhost:3443
volumes:
  smoke_database:
